server {
    listen 9999;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to Homey cloud API (avoids CORS)
    location /homey-api/ {
        proxy_pass https://652e7aa41e9ea1fb7ebfc439.homey.athom-prod-euwest1-001.homeypro.net/;
        proxy_set_header Host 652e7aa41e9ea1fb7ebfc439.homey.athom-prod-euwest1-001.homeypro.net;
        proxy_ssl_server_name on;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
